# https://taskfile.dev

version: "3"

tasks:
  library:
    dir: library
    sources:
      - "**/*.ts"
      - "**/*.js"
      - "**/*.json"
    generates:
      - "dist/**/*"
    cmds:
      - pnpm i
      - pnpm build
      - for:
          [
            "datastar-aliased.ts",
            "datastar-core.ts",
            "datastar.ts",
            "datastar-csp.ts",
            "datastar-aliased-csp.ts",
          ]
        cmd: |
          npx esbuild --bundle src/bundles/{{.ITEM}}  \
          --define:ALIAS=null \
          --outdir=../bundles/  \
          --minify --sourcemap \
          --target=es2023 \
          --format=esm

  default:
    deps: [library]
